<!-- SCRIPT UNIQUE TOUT-EN-UN (FIREBASE + LOGIQUE APP) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 1. Initialisation Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyB3vygYO0r0Q8Wx7lMiLARyuj99h1urHXA",
    authDomain: "babypredictv2.firebaseapp.com",
    databaseURL: "https://babypredictv2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "babypredictv2",
    storageBucket: "babypredictv2.firebasestorage.app",
    messagingSenderId: "682802850327",
    appId: "1:682802850327:web:ac161252e0997d3ad64a52"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 2. Variables d'état globales
  let currentUser = null;
  let isAdmin = false;

  window.predictions = JSON.parse(localStorage.getItem('bp_predictions')) || [];
  window.officialResult = JSON.parse(localStorage.getItem('bp_official')) || null;
  window.tempHistory = JSON.parse(localStorage.getItem('bp_temp')) || [];
  window.careEntries = JSON.parse(localStorage.getItem('bp_care')) || [];
  window.weightHistory = JSON.parse(localStorage.getItem('bp_weight')) || [];

  let chartTempInstance = null;
  let chartWeightInstance = null;
  let timerInterval = null;
  let timerSeconds = 0;

  // 3. Écouteurs Firebase Realtime
  onValue(ref(db, 'app/predictions'), (snapshot) => {
    const data = snapshot.val();
    window.predictions = data ? data : [];
    localStorage.setItem('bp_predictions', JSON.stringify(window.predictions));
    renderPredictions();
    if (window.officialResult) displayOfficialBanner();
  });

  onValue(ref(db, 'app/careEntries'), (snapshot) => {
    const data = snapshot.val();
    window.careEntries = data ? data : [];
    localStorage.setItem('bp_care', JSON.stringify(window.careEntries));
    renderCareEntries();
  });

  onValue(ref(db, 'app/tempHistory'), (snapshot) => {
    const data = snapshot.val();
    window.tempHistory = data ? data : [];
    localStorage.setItem('bp_temp', JSON.stringify(window.tempHistory));
    renderTempList();
    updateTempChart();
  });

  onValue(ref(db, 'app/weightHistory'), (snapshot) => {
    const data = snapshot.val();
    window.weightHistory = data ? data : [];
    localStorage.setItem('bp_weight', JSON.stringify(window.weightHistory));
    renderWeightList();
    updateWeightChart();
  });

  onValue(ref(db, 'app/officialResult'), (snapshot) => {
    window.officialResult = snapshot.val() || null;
    localStorage.setItem('bp_official', JSON.stringify(window.officialResult));
    if (window.officialResult) displayOfficialBanner();
  });

  // Sauvegarde Firebase + LocalStorage
  function saveAllToStorage() {
    localStorage.setItem('bp_predictions', JSON.stringify(window.predictions));
    localStorage.setItem('bp_official', JSON.stringify(window.officialResult));
    localStorage.setItem('bp_care', JSON.stringify(window.careEntries));
    localStorage.setItem('bp_weight', JSON.stringify(window.weightHistory));
    localStorage.setItem('bp_temp', JSON.stringify(window.tempHistory));

    set(ref(db, 'app/predictions'), window.predictions || []);
    set(ref(db, 'app/careEntries'), window.careEntries || []);
    set(ref(db, 'app/tempHistory'), window.tempHistory || []);
    set(ref(db, 'app/weightHistory'), window.weightHistory || []);
    if (window.officialResult) {
      set(ref(db, 'app/officialResult'), window.officialResult);
    }
  }

  // Fonctions attachées à window pour les attributs onclick/onsubmit du HTML
  window.handleLogin = function(e) {
    e.preventDefault();
    const username = document.getElementById('usernameInput').value.trim();
    const code = document.getElementById('accessCodeInput').value.trim();

    if (!username) return;

    currentUser = username;
    if (code.toUpperCase() === 'ADMIN2026') {
      isAdmin = true;
      document.getElementById('adminPanel')?.classList.remove('hidden');
      document.getElementById('adminUserOverride')?.classList.remove('hidden');
    } else {
      isAdmin = false;
      document.getElementById('adminPanel')?.classList.add('hidden');
      document.getElementById('adminUserOverride')?.classList.add('hidden');
    }

    document.getElementById('userBadge').innerHTML = `<i class="fa-solid fa-user-check text-emerald-500 mr-1"></i> ${currentUser} ${isAdmin ? '<span class="text-xs text-purple-600 font-bold">(Admin)</span>' : ''}`;
    document.getElementById('loginPage').classList.add('hidden');

    renderPredictions();
    renderCareEntries();
  };

  window.logout = function() {
    currentUser = null;
    isAdmin = false;
    document.getElementById('adminPanel')?.classList.add('hidden');
    document.getElementById('adminUserOverride')?.classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
    renderPredictions();
    renderCareEntries();
  };

  window.switchTab = function(tab) {
    const secPronostics = document.getElementById('section-pronostics');
    const secMaternite = document.getElementById('section-maternite');
    const tabPronostics = document.getElementById('tab-pronostics');
    const tabMaternite = document.getElementById('tab-maternite');

    if (tab === 'pronostics') {
      secPronostics.classList.remove('hidden');
      secMaternite.classList.add('hidden');
      tabPronostics.classList.add('active-tab');
      tabMaternite.classList.remove('active-tab');
    } else {
      secPronostics.classList.add('hidden');
      secMaternite.classList.remove('hidden');
      tabPronostics.classList.remove('active-tab');
      tabMaternite.classList.add('active-tab');
    }
  };

  window.toggleTimer = function() {
    const btn = document.getElementById('btnStartTimer');
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      btn.innerHTML = `<i class="fa-solid fa-play"></i> Reprendre`;
      btn.className = "px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-xl shadow transition";
    } else {
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
      }, 1000);
      btn.innerHTML = `<i class="fa-solid fa-pause"></i> Pause`;
      btn.className = "px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl shadow transition";
    }
  };

  window.resetTimer = function() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerSeconds = 0;
    updateTimerDisplay();
    const btn = document.getElementById('btnStartTimer');
    btn.innerHTML = `<i class="fa-solid fa-play"></i> Démarrer`;
    btn.className = "px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-xl shadow transition";
  };

  function updateTimerDisplay() {
    const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
    const secs = String(timerSeconds % 60).padStart(2, '0');
    const el = document.getElementById('timerDisplay');
    if (el) el.innerText = `${mins}:${secs}`;
  }

  window.saveTimerToCare = function() {
    if (timerSeconds === 0) return;

    const type = document.getElementById('timerType').value;
    const mins = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    const durationStr = mins > 0 ? `${mins} min ${secs} s` : `${secs} s`;

    let volume = 0;
    if (type === 'Repas (Biberon)') {
      const inputVol = prompt("Quantité bu au biberon (en ml) :", "60");
      if (inputVol !== null) volume = parseInt(inputVol) || 0;
    }

    const now = new Date();
    const timeStr = now.toTimeString().substring(0, 5);

    window.careEntries.push({
      time: timeStr,
      tempBaby: null,
      tempIncubator: null,
      diaper: "Propre / Rien",
      feeding: volume,
      notes: `Chronomètre : ${type} - Durée : ${durationStr}`,
      author: currentUser || "Parent"
    });

    saveAllToStorage();
    window.resetTimer();
  };

  window.addPrediction = function(e) {
    e.preventDefault();
    if (!currentUser) return;

    const editIdx = parseInt(document.getElementById('editPredIndex').value);

    let targetUser = currentUser;
    if (isAdmin && editIdx === -1) {
      const adminOverride = document.getElementById('predUserAdmin').value.trim();
      if (adminOverride) targetUser = adminOverride;
    } else if (editIdx !== -1) {
      targetUser = window.predictions[editIdx].user;
    }

    const newPred = {
      user: targetUser,
      name: document.getElementById('predName').value.trim(),
      hobby: document.getElementById('predHobby').value.trim() || 'Non renseigné',
      gender: document.getElementById('predGender').value,
      weight: parseFloat(document.getElementById('predWeight').value),
      height: parseFloat(document.getElementById('predHeight').value),
      date: document.getElementById('predDate').value
    };

    if (editIdx >= 0) window.predictions[editIdx] = newPred;
    else window.predictions.push(newPred);

    saveAllToStorage();
    window.cancelPredEdit();
  };

  window.editPrediction = function(index) {
    const p = window.predictions[index];
    if (!isAdmin && p.user !== currentUser) {
      alert("Vous ne pouvez modifier que votre propre pronostic !");
      return;
    }

    document.getElementById('editPredIndex').value = index;
    document.getElementById('predName').value = p.name;
    document.getElementById('predHobby').value = p.hobby === 'Non renseigné' ? '' : p.hobby;
    document.getElementById('predGender').value = p.gender;
    document.getElementById('predWeight').value = p.weight;
    document.getElementById('predHeight').value = p.height;
    document.getElementById('predDate').value = p.date;

    document.getElementById('formPredTitle').innerHTML = `<i class="fa-solid fa-pen text-amber-500"></i> Modifier le pronostic (${p.user})`;
    document.getElementById('btnSubmitPred').innerText = "Mettre à jour le pronostic";
    document.getElementById('btnSubmitPred').className = "w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md transition text-sm";
    document.getElementById('btnCancelPredEdit').classList.remove('hidden');
  };

  window.cancelPredEdit = function() {
    document.getElementById('editPredIndex').value = "-1";
    document.getElementById('predictionForm').reset();
    document.getElementById('predUserAdmin').value = '';
    document.getElementById('predDate').value = new Date().toISOString().split('T')[0];

    document.getElementById('formPredTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-pink-500"></i> Faire un pronostic`;
    document.getElementById('btnSubmitPred').innerText = "Enregistrer le pronostic";
    document.getElementById('btnSubmitPred').className = "w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl shadow-md transition text-sm";
    document.getElementById('btnCancelPredEdit').classList.add('hidden');
  };

  window.deletePrediction = function(index) {
    const p = window.predictions[index];
    if (!isAdmin && p.user !== currentUser) return;

    if (confirm(`Voulez-vous vraiment supprimer le pronostic de "${p.user}" ?`)) {
      window.predictions.splice(index, 1);
      saveAllToStorage();
    }
  };

  function renderPredictions() {
    const tbody = document.getElementById('predictionsTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    let countFille = 0;
    let totalWeight = 0;
    let totalHeight = 0;

    window.predictions.forEach((p, idx) => {
      if (p.gender === 'Fille') countFille++;
      totalWeight += p.weight;
      totalHeight += p.height;

      const isOwnerOrAdmin = isAdmin || (currentUser && p.user === currentUser);

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50/50 transition';
      tr.innerHTML = `
        <td class="py-3 font-semibold text-slate-700">${p.user}</td>
        <td class="py-3 font-bold text-pink-600">${p.name}</td>
        <td class="py-3 text-slate-600 italic text-xs"><span class="bg-pink-50 text-pink-700 px-2 py-1 rounded-lg border border-pink-100">${p.hobby || 'RAS'}</span></td>
        <td class="py-3">${p.gender === 'Fille' ? 'Fille' : 'Garçon'}</td>
        <td class="py-3 font-medium">${p.weight.toFixed(3)} kg</td>
        <td class="py-3 font-medium">${p.height} cm</td>
        <td class="py-3 text-slate-500">${p.date}</td>
        <td class="py-3 text-right">
          ${isOwnerOrAdmin ? `
            <button onclick="editPrediction(${idx})" class="p-1.5 text-slate-400 hover:text-amber-500 transition rounded-lg hover:bg-amber-50" title="Modifier"><i class="fa-solid fa-pen text-xs"></i></button>
            <button onclick="deletePrediction(${idx})" class="p-1.5 text-slate-400 hover:text-red-500 transition rounded-lg hover:bg-red-50" title="Supprimer"><i class="fa-solid fa-trash-can text-xs"></i></button>
          ` : '<span class="text-xs text-slate-300">-</span>'}
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('predCount').innerText = `${window.predictions.length} participation(s)`;

    if (window.predictions.length > 0) {
      const girlPct = Math.round((countFille / window.predictions.length) * 100);
      document.getElementById('statGender').innerText = `${girlPct}% Fille / ${100 - girlPct}% Garçon`;
      document.getElementById('statAvgWeight').innerText = `${(totalWeight / window.predictions.length).toFixed(3)} kg`;
      document.getElementById('statAvgHeight').innerText = `${(totalHeight / window.predictions.length).toFixed(1)} cm`;
    } else {
      document.getElementById('statGender').innerText = `--`;
      document.getElementById('statAvgWeight').innerText = `-- kg`;
      document.getElementById('statAvgHeight').innerText = `-- cm`;
    }
  }

  window.addCareEntry = function(e) {
    e.preventDefault();
    const editIdx = parseInt(document.getElementById('editCareIndex').value);

    const time = document.getElementById('careTime').value;
    const tempBaby = parseFloat(document.getElementById('careTempBaby').value) || null;
    const tempIncubator = parseFloat(document.getElementById('careTempIncubator').value) || null;
    const diaper = document.getElementById('careDiaper').value;
    const feeding = parseInt(document.getElementById('careFeeding').value) || 0;
    const notes = document.getElementById('careNotes').value.trim();

    const entry = {
      time,
      tempBaby,
      tempIncubator,
      diaper,
      feeding,
      notes: notes || 'RAS',
      author: editIdx >= 0 ? window.careEntries[editIdx].author : (currentUser || 'Soignant')
    };

    if (editIdx >= 0) window.careEntries[editIdx] = entry;
    else window.careEntries.push(entry);

    if (tempBaby !== null && editIdx === -1) {
      window.tempHistory.push({ time, tempBaby, tempIncubator });
    }

    saveAllToStorage();
    window.cancelCareEdit();
  };

  window.editCareEntry = function(index) {
    const c = window.careEntries[index];
    document.getElementById('editCareIndex').value = index;
    document.getElementById('careTime').value = c.time;
    document.getElementById('careTempBaby').value = c.tempBaby || '';
    document.getElementById('careTempIncubator').value = c.tempIncubator || '';
    document.getElementById('careDiaper').value = c.diaper;
    document.getElementById('careFeeding').value = c.feeding || '';
    document.getElementById('careNotes').value = c.notes === 'RAS' ? '' : c.notes;

    document.getElementById('formCareTitle').innerHTML = `<i class="fa-solid fa-pen text-amber-500"></i> Modifier l'observation`;
    document.getElementById('btnSubmitCare').innerText = "Mettre à jour l'observation";
    document.getElementById('btnSubmitCare').className = "w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-md transition text-sm";
    document.getElementById('btnCancelCareEdit').classList.remove('hidden');
  };

  window.cancelCareEdit = function() {
    document.getElementById('editCareIndex').value = "-1";
    document.getElementById('careForm').reset();
    document.getElementById('careTime').value = new Date().toTimeString().substring(0, 5);

    document.getElementById('formCareTitle').innerHTML = `<i class="fa-solid fa-notes-medical text-emerald-500"></i> Nouvelle Transmission Soin`;
    document.getElementById('btnSubmitCare').innerText = "Enregistrer l'observation";
    document.getElementById('btnSubmitCare').className = "w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-md transition text-sm";
    document.getElementById('btnCancelCareEdit').classList.add('hidden');
  };

  window.deleteCareEntry = function(index) {
    if (confirm("Voulez-vous vraiment supprimer cette entrée ?")) {
      window.careEntries.splice(index, 1);
      saveAllToStorage();
    }
  };

  function renderCareEntries() {
    const tbody = document.getElementById('careTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    let totalMeals = 0;
    let totalVolume = 0;
    let totalDiapers = 0;

    window.careEntries.forEach((c, idx) => {
      if (c.feeding > 0) {
        totalMeals++;
        totalVolume += c.feeding;
      }
      if (c.diaper !== 'Propre / Rien') totalDiapers++;

      let tempHtml = '--';
      if (c.tempBaby) {
        if (c.tempBaby >= 37.5) {
          tempHtml = `<span class="font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded-full animate-pulse"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${c.tempBaby}°C</span>`;
        } else if (c.tempBaby <= 35.5) {
          tempHtml = `<span class="font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full animate-pulse"><i class="fa-solid fa-temperature-arrow-down mr-1"></i>${c.tempBaby}°C</span>`;
        } else {
          tempHtml = `<span class="font-bold text-emerald-600">${c.tempBaby}°C</span>`;
        }
      }

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50/50 transition';
      tr.innerHTML = `
        <td class="py-3 font-bold text-slate-700">${c.time}</td>
        <td class="py-3">${tempHtml} ${c.tempIncubator ? `<span class="text-xs text-slate-400">(${c.tempIncubator}°C)</span>` : ''}</td>
        <td class="py-3"><span class="px-2 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-100">${c.diaper}</span></td>
        <td class="py-3 font-bold text-emerald-600">${c.feeding > 0 ? c.feeding + ' ml' : '--'}</td>
        <td class="py-3 text-slate-600 text-xs italic">${c.notes}</td>
        <td class="py-3 text-slate-400 text-xs">${c.author}</td>
        <td class="py-3 text-right no-pdf flex justify-end gap-1">
          <button onclick="editCareEntry(${idx})" class="p-1.5 text-slate-400 hover:text-amber-500 transition rounded-lg hover:bg-amber-50" title="Modifier"><i class="fa-solid fa-pen text-xs"></i></button>
          <button onclick="deleteCareEntry(${idx})" class="p-1.5 text-slate-400 hover:text-red-500 transition rounded-lg hover:bg-red-50" title="Supprimer"><i class="fa-solid fa-trash-can text-xs"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('statMealsToday').innerText = totalMeals;
    document.getElementById('statMealsVol').innerText = `Volume total : ${totalVolume} ml`;
    document.getElementById('statDiapersToday').innerText = totalDiapers;

    updateNextFeedingReminder();
  }

  window.updateNextFeedingReminder = function() {
    if (window.careEntries.length === 0) return;

    const lastFeeding = [...window.careEntries].reverse().find(c => c.feeding > 0);
    if (!lastFeeding) return;

    const intervalHours = parseInt(document.getElementById('feedingInterval').value);
    const [hours, minutes] = lastFeeding.time.split(':').map(Number);
    
    let nextHours = (hours + intervalHours) % 24;
    const formattedNext = `${String(nextHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;

    document.getElementById('nextFeedingTimer').innerHTML = `Dernier repas : <strong>${lastFeeding.time}</strong> (${lastFeeding.feeding} ml) — Prochain estimé : <strong class="text-amber-600">${formattedNext}</strong>`;
  };

  window.addTempPoint = function(e) {
    e.preventDefault();
    const timeVal = document.getElementById('tempPointTime').value.trim();
    const tempBabyVal = parseFloat(document.getElementById('tempPointBaby').value);
    const tempIncVal = parseFloat(document.getElementById('tempPointIncubator').value) || null;

    if (!timeVal || isNaN(tempBabyVal)) return;

    window.tempHistory.push({ time: timeVal, tempBaby: tempBabyVal, tempIncubator: tempIncVal });

    saveAllToStorage();
    document.getElementById('tempPointBaby').value = '';
    document.getElementById('tempPointIncubator').value = '';
  };

  window.editTempPoint = function(index) {
    const item = window.tempHistory[index];
    const newTemp = prompt("Nouvelle température (°C) :", item.tempBaby);
    if (newTemp !== null) {
      const val = parseFloat(newTemp);
      if (!isNaN(val)) {
        window.tempHistory[index].tempBaby = val;
        saveAllToStorage();
      }
    }
  };

  window.removeTempPoint = function(index) {
    window.tempHistory.splice(index, 1);
    saveAllToStorage();
  };

  function renderTempList() {
    const container = document.getElementById('tempPointsList');
    if (!container) return;
    container.innerHTML = '';

    if (window.tempHistory.length === 0) {
      container.innerHTML = `<p class="text-slate-400 italic">Aucune mesure enregistrée.</p>`;
      return;
    }

    window.tempHistory.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'flex items-center justify-between bg-white/80 p-2 rounded-xl border border-slate-100 shadow-sm hover:border-red-200 transition';
      div.innerHTML = `
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-temperature-half text-red-500"></i>
          <span class="font-bold text-slate-700">${item.tempBaby} °C</span>
          ${item.tempIncubator ? `<span class="text-[11px] text-slate-400">(Couv: ${item.tempIncubator}°C)</span>` : ''}
          <span class="text-[11px] text-slate-400">à ${item.time}</span>
        </div>
        <div class="flex gap-1">
          <button onclick="editTempPoint(${index})" class="text-slate-400 hover:text-amber-500 p-1 rounded-lg hover:bg-amber-50 transition" title="Modifier"><i class="fa-solid fa-pen text-xs"></i></button>
          <button onclick="removeTempPoint(${index})" class="text-slate-400 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition" title="Supprimer"><i class="fa-solid fa-trash-can text-xs"></i></button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function updateTempChart() {
    if (!chartTempInstance) return;

    chartTempInstance.data.labels = window.tempHistory.map(c => c.time);
    chartTempInstance.data.datasets[0].data = window.tempHistory.map(c => c.tempBaby);
    chartTempInstance.data.datasets[1].data = window.tempHistory.map(c => c.tempIncubator);
    chartTempInstance.update();

    const cardTemp = document.getElementById('cardTempStatus');
    const statTempStatus = document.getElementById('statTempStatus');

    if (window.tempHistory.length > 0) {
      const lastTemp = window.tempHistory[window.tempHistory.length - 1].tempBaby;
      document.getElementById('statLastTemp').innerText = `${lastTemp} °C`;

      if (lastTemp >= 37.5) {
        statTempStatus.innerText = "Alerte : Hyperthermie / Fièvre !";
        statTempStatus.className = "text-xs font-extrabold mt-1 text-red-600";
        cardTemp.className = "glassmorphism p-4 rounded-2xl border-2 border-red-400 bg-red-50/50";
      } else if (lastTemp <= 35.5) {
        statTempStatus.innerText = "Alerte : Hypothermie !";
        statTempStatus.className = "text-xs font-extrabold mt-1 text-blue-600";
        cardTemp.className = "glassmorphism p-4 rounded-2xl border-2 border-blue-400 bg-blue-50/50";
      } else {
        statTempStatus.innerText = "Statut : Normal";
        statTempStatus.className = "text-xs font-semibold mt-1 text-emerald-600";
        cardTemp.className = "glassmorphism p-4 rounded-2xl border border-white/50";
      }
    } else {
      document.getElementById('statLastTemp').innerText = `-- °C`;
      statTempStatus.innerText = "Statut : Normal";
      statTempStatus.className = "text-xs font-semibold mt-1 text-emerald-600";
      cardTemp.className = "glassmorphism p-4 rounded-2xl border border-white/50";
    }
  }

  window.addWeightPoint = function(e) {
    e.preventDefault();
    const dateVal = document.getElementById('weightPointDate').value;
    const weightVal = parseFloat(document.getElementById('weightPointVal').value);

    if (!dateVal || isNaN(weightVal)) return;

    window.weightHistory.push({ date: dateVal, weight: weightVal });
    window.weightHistory.sort((a, b) => new Date(a.date) - new Date(b.date));

    saveAllToStorage();
    document.getElementById('weightPointVal').value = '';
  };

  window.editWeightPoint = function(index) {
    const item = window.weightHistory[index];
    const newWeight = prompt("Nouveau poids (kg) :", item.weight);
    if (newWeight !== null) {
      const val = parseFloat(newWeight);
      if (!isNaN(val)) {
        window.weightHistory[index].weight = val;
        saveAllToStorage();
      }
    }
  };

  window.removeWeightPoint = function(index) {
    window.weightHistory.splice(index, 1);
    saveAllToStorage();
  };

  function updateWeightChart() {
    if (!chartWeightInstance) return;

    chartWeightInstance.data.labels = window.weightHistory.map(item => item.date);
    chartWeightInstance.data.datasets[0].data = window.weightHistory.map(item => item.weight);
    chartWeightInstance.update();

    if (window.weightHistory.length > 0) {
      const latest = window.weightHistory[window.weightHistory.length - 1].weight;
      document.getElementById('statCurrentWeight').innerText = `${latest.toFixed(3)} kg`;

      if (window.weightHistory.length > 1) {
        const prev = window.weightHistory[0].weight;
        const diffGrams = Math.round((latest - prev) * 1000);
        const sign = diffGrams >= 0 ? '+' : '';
        document.getElementById('statWeightDiff').innerText = `${sign}${diffGrams} g depuis le 1er relevé`;
      }
    } else {
      document.getElementById('statCurrentWeight').innerText = `-- kg`;
      document.getElementById('statWeightDiff').innerText = `Aucune donnée`;
    }
  }

  function renderWeightList() {
    const container = document.getElementById('weightPointsList');
    if (!container) return;
    container.innerHTML = '';

    if (window.weightHistory.length === 0) {
      container.innerHTML = `<p class="text-slate-400 italic">Aucune mesure enregistrée.</p>`;
      return;
    }

    window.weightHistory.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'flex items-center justify-between bg-white/80 p-2 rounded-xl border border-slate-100 shadow-sm hover:border-blue-200 transition';
      div.innerHTML = `
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-weight-scale text-blue-500"></i>
          <span class="font-bold text-slate-700">${item.weight.toFixed(3)} kg</span>
          <span class="text-[11px] text-slate-400">(${item.date})</span>
        </div>
        <div class="flex gap-1">
          <button onclick="editWeightPoint(${index})" class="text-slate-400 hover:text-amber-500 p-1 rounded-lg hover:bg-amber-50 transition" title="Modifier"><i class="fa-solid fa-pen text-xs"></i></button>
          <button onclick="removeWeightPoint(${index})" class="text-slate-400 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition" title="Supprimer"><i class="fa-solid fa-trash-can text-xs"></i></button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function initCharts() {
    const elTemp = document.getElementById('chartTemp');
    if (elTemp) {
      chartTempInstance = new Chart(elTemp.getContext('2d'), {
        type: 'line',
        data: {
          labels: window.tempHistory.map(c => c.time),
          datasets: [
            {
              label: 'Temp. Bébé (°C)',
              data: window.tempHistory.map(c => c.tempBaby),
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.1)',
              tension: 0.3,
              fill: true,
              pointRadius: 5
            },
            {
              label: 'Temp. Couveuse (°C)',
              data: window.tempHistory.map(c => c.tempIncubator),
              borderColor: '#f59e0b',
              borderDash: [5, 5],
              tension: 0.3,
              pointRadius: 3
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } },
          scales: { y: { min: 30, max: 40 } }
        }
      });
    }

    const elWeight = document.getElementById('chartWeight');
    if (elWeight) {
      chartWeightInstance = new Chart(elWeight.getContext('2d'), {
        type: 'line',
        data: {
          labels: window.weightHistory.map(w => w.date),
          datasets: [{
            label: 'Poids du bébé (kg)',
            data: window.weightHistory.map(w => w.weight),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.15)',
            fill: true,
            tension: 0.2,
            pointBackgroundColor: '#2563eb',
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { title: { display: true, text: 'Poids (kg)' } } }
        }
      });
    }
  }

  window.exportCarePDF = function() {
    const element = document.getElementById('careJournalContainer');
    element.classList.add('pdf-compact');

    const opt = {
      margin:       [0.3, 0.3, 0.3, 0.3],
      filename:     `Fiche_Soins_Maternite_${new Date().toISOString().split('T')[0]}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
      element.classList.remove('pdf-compact');
    });
  };

  window.saveOfficialResults = function(e) {
    e.preventDefault();
    const name = document.getElementById('officialName').value.trim();
    const gender = document.getElementById('officialGender').value;
    const weight = parseFloat(document.getElementById('officialWeight').value);
    const height = parseFloat(document.getElementById('officialHeight').value);

    window.officialResult = { name, gender, weight, height };
    saveAllToStorage();
    displayOfficialBanner();
  };

  function displayOfficialBanner() {
    if (!window.officialResult) return;

    let bestWinner = null;
    let minDiff = Infinity;

    window.predictions.forEach(p => {
      const diffW = Math.abs(p.weight - window.officialResult.weight);
      const diffH = Math.abs(p.height - window.officialResult.height);
      const score = diffW * 10 + diffH;

      if (score < minDiff) {
        minDiff = score;
        bestWinner = p.user;
      }
    });

    document.getElementById('resBabyName').innerText = `Bienvenue à ${window.officialResult.name} !`;
    document.getElementById('resBabyDetails').innerText = `Sexe : ${window.officialResult.gender} | Poids : ${window.officialResult.weight} kg | Taille : ${window.officialResult.height} cm`;
    document.getElementById('resWinnerName').innerText = bestWinner ? bestWinner : 'Égalité !';
    document.getElementById('resultBanner').classList.remove('hidden');
  }

  // Initialisation globale
  window.addEventListener('DOMContentLoaded', () => {
    const todayStr = new Date().toISOString().split('T')[0];
    if (document.getElementById('predDate')) document.getElementById('predDate').value = todayStr;
    if (document.getElementById('weightPointDate')) document.getElementById('weightPointDate').value = todayStr;

    const now = new Date();
    const currentTimeStr = now.toTimeString().substring(0, 5);
    if (document.getElementById('careTime')) document.getElementById('careTime').value = currentTimeStr;
    if (document.getElementById('tempPointTime')) document.getElementById('tempPointTime').value = currentTimeStr;
    if (document.getElementById('careDateHeader')) {
      document.getElementById('careDateHeader').innerText = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    initCharts();
    renderPredictions();
    renderCareEntries();
    renderWeightList();
    renderTempList();
    updateWeightChart();
    updateTempChart();

    if (window.officialResult) displayOfficialBanner();
  });
</script>
