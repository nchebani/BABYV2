<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB3vygYO0r0Q8Wx7lMiLARyuj99h1urHXA",
    authDomain: "babypredictv2.firebaseapp.com",
    databaseURL: "https://babypredictv2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "babypredictv2",
    storageBucket: "babypredictv2.firebasestorage.app",
    messagingSenderId: "682802850327",
    appId: "1:682802850327:web:ac161252e0997d3ad64a52"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Fonction globale pour sauvegarder sur Firebase
  window.saveToFirebase = function(path, data) {
    set(ref(db, path), data);
  };

  // Écoute synchrone sur toutes les clés
  const nodes = ['predictions', 'careEntries', 'tempHistory', 'weightHistory', 'officialResult'];
  
  nodes.forEach(node => {
    onValue(ref(db, node), (snapshot) => {
      const data = snapshot.val();
      if (data !== null) {
        window[node] = data;
        localStorage.setItem(`bp_${node}`, JSON.stringify(data));

        // Rafraîchir l'interface
        if (typeof renderPredictions === 'function') renderPredictions();
        if (typeof renderCareEntries === 'function') renderCareEntries();
        if (typeof updateTempChart === 'function') { updateTempChart(); renderTempList(); }
        if (typeof updateWeightChart === 'function') { updateWeightChart(); renderWeightList(); }
        if (node === 'officialResult' && data) displayOfficialBanner();
      }
    });
  });
</script>
