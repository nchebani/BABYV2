  <!-- Intégration et Configuration Firebase (SDK Web v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // Tes identifiants et clés de configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyB3vygYO0r0Q8Wx7lMiLARyuj99h1urHXA",
      authDomain: "babypredictv2.firebaseapp.com",
      databaseURL: "https://babypredictv2-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "babypredictv2",

      messagingSenderId: "682802850327",
      appId: "1:682802850327:web:ac161252e0997d3ad64a52",
      measurementId: "G-7C78NKMTDT"
    };

    // Initialisation des services Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    // Exemple de fonctions utilitaires pour interagir avec Firebase
    // Pour enregistrer une nouvelle prédiction :
    window.savePrediction = function(data) {
      const predictionsRef = ref(db, 'predictions');
      const newPredictionRef = push(predictionsRef);
      set(newPredictionRef, data);
    };

    // Écoute en temps réel des changements dans la base de données
    const predictionsRef = ref(db, 'predictions');

      console.log("Données Firebase en direct :", data);

    });
